<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Dashboard | Student Edition</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --border-color: rgba(148, 163, 184, 0.1);
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { color: var(--text-muted); font-size: 14px; margin-top: 4px; }

    .nav a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav a:hover { color: var(--accent-blue); }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .panel h2 {
      margin: 0 0 20px 0;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      margin-bottom: 16px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    input:focus, select:focus { outline: none; border-color: var(--accent-blue); }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active { transform: scale(0.98); }

    .btn-primary { background: var(--accent-blue); color: white; }
    .btn-success { background: var(--accent-green); color: white; }
    .btn-danger { background: var(--accent-red); color: white; }
    .btn-small { padding: 8px 12px; font-size: 12px; width: auto; }

    button:hover { opacity: 0.9; }

    .row-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .visual-card {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 12px;
      padding: 20px;
      color: white;
      position: relative;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
    }

    .vc-header { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.8; margin-bottom: 20px; }
    .vc-number { font-family: monospace; font-size: 18px; letter-spacing: 2px; margin-bottom: 16px; }
    .vc-footer { display: flex; justify-content: space-between; align-items: flex-end; }
    .vc-holder { font-size: 12px; text-transform: uppercase; }
    .vc-balance { font-size: 20px; font-weight: 700; }

    .cards-list-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 24px;
    }

    .console-output {
      background: #020617;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      font-family: 'Consolas', monospace;
      font-size: 13px;
      color: #a5f3fc;
      min-height: 150px;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .balance-hint {
      font-size: 12px;
      color: #4ade80;
      margin-top: -12px;
      margin-bottom: 14px;
      min-height: 16px;
    }

    .transfer-result {
      margin-top: 12px;
      padding: 12px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }

    @media (max-width: 900px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: flex-start; gap: 12px; }
      .nav { margin-left: -20px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <div>
      <h1>Bank Dashboard</h1>
      <div class="subtitle">Управление картами и транзакциями</div>
    </div>
    <nav class="nav">
      <a href="/login.html">Вход</a>
      <a href="/register.html">Регистрация</a>
      <a href="/admin.html">Админка</a>
      <a href="#" onclick="logout(); return false;" style="color: var(--accent-red);">Выйти</a>
    </nav>
  </div>

  <div class="dashboard-grid">

    <!-- LEFT: MY CARDS -->
    <div class="panel">
      <h2>📇 Мои карты</h2>

      <div class="row-inputs" style="max-width: 400px; margin-bottom: 16px;">
        <div>
          <label>Страница</label>
          <input id="cardsPage" type="number" value="0" min="0">
        </div>
        <div>
          <label>Размер</label>
          <input id="cardsSize" type="number" value="10" min="1">
        </div>
      </div>
      <div style="max-width: 400px;">
        <label>Фильтр по статусу</label>
        <select id="cardsStatus">
          <option value="">Все карты</option>
          <option value="ACTIVE">Активные</option>
          <option value="BLOCKED">Заблокированные</option>
        </select>
      </div>

      <button class="btn-primary" onclick="loadMyCards()" style="max-width: 200px;">Обновить список</button>

      <div id="cardsContainer" class="cards-list-container"></div>
    </div>

    <!-- RIGHT: TRANSFER & LOG -->
    <div style="display: flex; flex-direction: column; gap: 24px;">

      <div class="panel">
        <h2>📲 Перевод по телефону</h2>

        <label>Ваша карта (отправитель)</label>
        <select id="fromCardSelect">
          <option value="" disabled selected>Выберите карту...</option>
        </select>
        <div id="senderBalanceHint" class="balance-hint"></div>

        <label>Телефон получателя</label>
        <input id="recipientPhone" type="tel" placeholder="+79001234567">

        <label>Сумма перевода (₽)</label>
        <input id="transferAmount" type="number" step="0.01" min="0.01" placeholder="0.00">

        <button class="btn-success" onclick="transferByPhone()">Перевести средства</button>

        <div id="transferResult" class="transfer-result"></div>
      </div>

      <!-- Request New Card -->
      <div class="panel">
        <h2>🆕 Новая карта</h2>
        <p style="color: var(--text-muted); font-size: 13px; margin: -8px 0 16px;">
          Отправьте заявку — администратор выпустит карту на ваше имя.
        </p>

        <label>Имя держателя карты</label>
        <input id="requestCardholderName" type="text" placeholder="IVAN IVANOV">

        <button class="btn-primary" onclick="requestNewCard()">Отправить заявку</button>
      </div>

      <div class="panel">
        <h2>🖥️ Лог операций</h2>
        <pre id="output" class="console-output">// Ожидание действий...</pre>
      </div>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
  let myCardsCache = [];

  function setOutput(data) {
    document.getElementById('output').textContent = JSON.stringify(data, null, 2);
  }

  async function loadMyCards() {
    try {
      const page = document.getElementById("cardsPage").value || 0;
      const size = document.getElementById("cardsSize").value || 10;
      const status = document.getElementById("cardsStatus").value;

      let url = `/api/cards?page=${encodeURIComponent(page)}&size=${encodeURIComponent(size)}`;
      if (status) url += `&status=${encodeURIComponent(status)}`;

      const data = await apiGet(url);
      setOutput(data);

      myCardsCache = data.content || [];
      renderCardsVisual(myCardsCache);
      populateSenderDropdown(myCardsCache);
    } catch (e) {
      setOutput({ error: e.message });
    }
  }

  function populateSenderDropdown(cards) {
    const select = document.getElementById("fromCardSelect");
    select.innerHTML = '<option value="" disabled selected>Выберите карту...</option>';

    cards.filter(c => c.status === 'ACTIVE').forEach(card => {
      const option = document.createElement("option");
      option.value = card.id;
      option.textContent = `${card.cardholderName || 'Карта'} — ${card.cardNumberMasked || '•••• ' + card.id}`;
      option.dataset.balance = card.balance ?? 0;
      select.appendChild(option);
    });
  }

  document.getElementById("fromCardSelect").addEventListener("change", function () {
    const bal = this.options[this.selectedIndex]?.dataset.balance;
    document.getElementById("senderBalanceHint").textContent = bal !== undefined ? `Доступно: ${bal} ₽` : "";
  });

  function renderCardsVisual(cards) {
    const container = document.getElementById("cardsContainer");
    container.innerHTML = "";

    if (!cards.length) {
      container.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">Карты не найдены.</div>';
      return;
    }

    cards.forEach(card => {
      const wrapper = document.createElement("div");

      const div = document.createElement("div");
      div.className = "visual-card";

      const maskedNum = card.cardNumberMasked || "**** **** **** ????";
      const balance = `${card.balance ?? 0} ₽`;
      const holder = card.cardholderName || "HOLDER NAME";
      const statusColor = card.status === 'ACTIVE' ? '#4ade80' : '#f87171';

      div.innerHTML = `
        <div class="vc-header">
          <span>BANK REST API</span>
          <span style="color:${statusColor}; font-weight:bold;">${card.status || 'UNKNOWN'}</span>
        </div>
        <div class="vc-number">${maskedNum}</div>
        <div class="vc-footer">
          <div class="vc-holder">${holder}</div>
          <div class="vc-balance">${balance}</div>
        </div>
      `;

      const btnBlock = document.createElement("button");
      btnBlock.className = "btn-danger btn-small";
      btnBlock.innerText = "Заблокировать";
      btnBlock.style.marginTop = "8px";
      btnBlock.onclick = () => requestBlockDirect(card.id);

      wrapper.appendChild(div);
      if (card.status === 'ACTIVE') wrapper.appendChild(btnBlock);
      container.appendChild(wrapper);
    });
  }

  async function requestBlockDirect(id) {
    if (!confirm(`Заблокировать карту #${id}?`)) return;
    try {
      await apiPost(`/api/cards/${id}/block-request`, {});
      setOutput({ message: `Карта #${id} заблокирована` });
      loadMyCards();
    } catch (e) {
      setOutput({ error: e.message });
    }
  }

  async function transferByPhone() {
    const fromCardId = document.getElementById("fromCardSelect").value;
    const recipientPhone = document.getElementById("recipientPhone").value.trim();
    const amount = Number(document.getElementById("transferAmount").value);

    if (!fromCardId) return alert("Выберите карту отправителя!");
    if (!recipientPhone) return alert("Введите номер телефона получателя!");
    if (!amount || amount <= 0) return alert("Введите корректную сумму!");

    try {
      const data = await apiPost("/api/cards/transfer/phone", {
        fromCardId: Number(fromCardId),
        recipientPhone,
        amount
      });

      setOutput(data);

      const resultEl = document.getElementById("transferResult");
      resultEl.style.display = "block";
      resultEl.textContent = `Перевод выполнен! Остаток: ${data.remainingBalance} ₽`;

      document.getElementById("transferAmount").value = "";
      document.getElementById("recipientPhone").value = "";
      loadMyCards();
    } catch (e) {
      setOutput({ error: e.message });
      alert("Ошибка: " + e.message);
    }
  }

  async function requestNewCard() {
    const cardholderName = document.getElementById("requestCardholderName").value.trim();
    if (!cardholderName) return alert("Введите имя держателя карты!");

    try {
      const data = await apiPost("/api/cards/request", { cardholderName });
      setOutput(data);
      document.getElementById("requestCardholderName").value = "";
      alert("Заявка #" + data.id + " отправлена! Ожидайте подтверждения от администратора.");
    } catch (e) {
      setOutput({ error: e.message });
      alert("Ошибка: " + e.message);
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    loadMyCards();
  });
</script>
</body>
</html>
