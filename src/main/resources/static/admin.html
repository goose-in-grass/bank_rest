<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ — Bank REST</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#0f172a; color:#e5e7eb; }
    .container { max-width:1200px; margin:0 auto; padding:24px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); gap:16px; }
    .card { background:#111827; border:1px solid #374151; border-radius:16px; padding:20px; }
    label { display:block; margin:12px 0 6px; color:#9ca3af; font-size:14px; }
    input, button { width:100%; box-sizing:border-box; border-radius:10px; padding:12px; font-size:14px; }
    input { border:1px solid #374151; background:#0b1220; color:#e5e7eb; }
    button { margin-top:12px; border:none; cursor:pointer; font-weight:700; background:#60a5fa; color:white; }
    .secondary { background:#374151; }
    .success { background:#34d399; color:#052e2b; }
    .danger { background:#f87171; color:#3b0a0a; }
    .muted { color:#9ca3af; font-size:13px; }
    pre { margin-top:16px; white-space:pre-wrap; background:#020617; padding:12px; border-radius:12px; border:1px solid #374151; min-height:180px; overflow:auto; }
    .nav a { color:#93c5fd; text-decoration:none; margin-right:12px; }
    .card-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .card-actions button { width:auto; padding:8px 12px; margin-top:0; }
    .cards-list { display:grid; gap:10px; margin-top:12px; }
    .card-item { border:1px solid #374151; border-radius:12px; padding:12px; background:#0b1220; }
  </style>
</head>
<body>
<div class="container">
  <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:20px;">
    <div>
      <h1>Админ-панель</h1>
      <div class="muted">Создание и управление картами, просмотр всех карт</div>
    </div>
    <div class="nav">
      <a href="/login.html">Вход</a>
      <a href="/home.html">Главная</a>
      <a href="/register.html">Регистрация</a>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Создать карту</h2>
      <label>Owner ID</label>
      <input id="ownerId" type="number" placeholder="1">
      <label>Cardholder name</label>
      <input id="cardholderName" type="text" placeholder="Ivan Ivanov">
      <label>Initial balance</label>
      <input id="initialBalance" type="number" step="0.01" placeholder="1000.00">
      <button onclick="createCard()">Создать</button>
    </div>

    <div class="card">
      <h2>Операции с картой</h2>
      <label>Card ID</label>
      <input id="adminCardId" type="number" placeholder="1">
      <div class="card-actions">
        <button class="secondary" onclick="blockCard()">Block</button>
        <button class="success" onclick="activateCard()">Activate</button>
        <button class="danger" onclick="deleteCard()">Delete</button>
      </div>
    </div>

    <div class="card">
      <h2>Все карты</h2>
      <label>Page</label>
      <input id="allCardsPage" type="number" value="0" min="0">
      <label>Size</label>
      <input id="allCardsSize" type="number" value="10" min="1">
      <label>Status filter</label>
      <input id="allCardsStatus" type="text" placeholder="ACTIVE">
      <button onclick="loadAllCards()">Загрузить все карты</button>
      <div id="cardsContainer" class="cards-list"></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h2>Ответ сервера</h2>
    <pre id="output">{}</pre>
  </div>
</div>

<script src="/app.js"></script>
<script>
  async function createCard() {
    try {
      const body = {
        ownerId: Number(document.getElementById("ownerId").value),
        cardholderName: document.getElementById("cardholderName").value.trim(),
        initialBalance: Number(document.getElementById("initialBalance").value)
      };

      const data = await apiPost("/api/admin/cards", body);
      setOutput(data);
    } catch (e) {
      setOutput({ error: e.message });
    }
  }

  async function blockCard() {
    try {
      const cardId = document.getElementById("adminCardId").value;
      const data = await apiPost(`/api/admin/cards/${encodeURIComponent(cardId)}/block`, {});
      setOutput(data || { message: "ok" });
    } catch (e) {
      setOutput({ error: e.message });
    }
  }

  async function activateCard() {
    try {
      const cardId = document.getElementById("adminCardId").value;
      const data = await apiPost(`/api/admin/cards/${encodeURIComponent(cardId)}/activate`, {});
      setOutput(data || { message: "ok" });
    } catch (e) {
      setOutput({ error: e.message });
    }
  }

  async function deleteCard() {
    try {
      const cardId = document.getElementById("adminCardId").value;
      const data = await apiDelete(`/api/admin/cards/${encodeURIComponent(cardId)}`);
      setOutput(data || { message: "deleted" });
    } catch (e) {
      setOutput({ error: e.message });
    }
  }

  async function loadAllCards() {
    try {
      const page = document.getElementById("allCardsPage").value || 0;
      const size = document.getElementById("allCardsSize").value || 10;
      const status = document.getElementById("allCardsStatus").value.trim();

      let url = `/api/admin/cards?page=${encodeURIComponent(page)}&size=${encodeURIComponent(size)}`;
      if (status) url += `&status=${encodeURIComponent(status)}`;

      const data = await apiGet(url);
      setOutput(data);
      renderCards(data.content || []);
    } catch (e) {
      setOutput({ error: e.message });
    }
  }

  function renderCards(cards) {
    const container = document.getElementById("cardsContainer");
    container.innerHTML = "";

    if (!cards.length) {
      container.innerHTML = '<div class="muted">Пока нет данных</div>';
      return;
    }

    cards.forEach(card => {
      const div = document.createElement("div");
      div.className = "card-item";
      div.innerHTML = `
                <div><strong>#${card.id}</strong> — ${card.cardholderName || ""}</div>
                <div class="muted">${card.cardNumberMasked || ""}</div>
                <div>Status: ${card.status || ""}</div>
                <div>Balance: ${card.balance ?? ""}</div>
                <div>Owner: ${card.ownerId ?? ""}</div>
            `;
      container.appendChild(div);
    });
  }

  loadAllCards();
</script>
</body>
</html>
