<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Bank REST</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#0f172a; color:#e5e7eb; }
    .wrap { max-width:420px; margin:40px auto; padding:24px; }
    .card { background:#111827; border:1px solid #374151; border-radius:16px; padding:24px; }
    label { display:block; margin:12px 0 6px; color:#9ca3af; font-size:14px; }
    input, button { width:100%; box-sizing:border-box; border-radius:10px; padding:12px; font-size:14px; }
    input { border:1px solid #374151; background:#0b1220; color:#e5e7eb; }
    button { margin-top:12px; border:none; cursor:pointer; font-weight:700; }
    .primary { background:#60a5fa; color:white; }
    .secondary { background:#374151; color:white; }
    .success { background:#34d399; color:#052e2b; }
    .danger { background:#f87171; color:#3b0a0a; }
    .row { display:flex; gap:10px; }
    .row button { flex:1; }
    .muted { color:#9ca3af; font-size:13px; margin-top:12px; }
    .toplinks { display:flex; justify-content:space-between; margin-top:14px; font-size:14px; }
    a { color:#93c5fd; text-decoration:none; }
    pre { margin-top:16px; white-space:pre-wrap; background:#020617; padding:12px; border-radius:12px; border:1px solid #374151; min-height:80px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Bank REST</h1>
    <p class="muted">Вход в систему</p>

    <label for="username">Логин</label>
    <input id="username" type="text" placeholder="username">

    <label for="password">Пароль</label>
    <input id="password" type="password" placeholder="password">

    <button class="primary" onclick="login()">Войти</button>

    <div class="row">
      <button class="secondary" onclick="loginAsAdmin()">Войти как админ</button>
      <button class="success" onclick="goRegister()">Я новый пользователь</button>
    </div>

    <div class="toplinks">
      <a href="/home.html">Главная</a>
      <a href="/admin.html">Админка</a>
    </div>

    <pre id="output">{}</pre>
  </div>
</div>

<script src="/app.js"></script>
<script>
  function loginAsAdmin() {
    document.getElementById("username").value = "admin";
    document.getElementById("password").value = "admin";
    login();
  }

  function goRegister() {
    window.location.href = "/register.html";
  }
</script>
</body>
</html>
